name: Publish Instagram reels

on:
  schedule:
    # Two primary slots plus catch-up checks. The scheduler is idempotent, so
    # catch-up runs no-op after success. Non-zero minutes avoid GitHub's busiest
    # top-of-hour scheduling window.
    - cron: '37 11 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '17 12 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '7 13 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '7 20 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '47 20 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '27 21 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '7 22 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '7 23 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Manual action'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - live-due

permissions:
  contents: write

concurrency:
  group: ig-charity-publisher
  cancel-in-progress: false

jobs:
  publish-due-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install app
        run: python -m pip install -e .

      - name: Cache licensed music
        uses: actions/cache@v4
        with:
          path: .cache/music
          key: charity-music-${{ hashFiles('config/music.yml') }}

      - name: Render safe manual preview
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        run: python -m app.main --render-only --force-slot 2099-01-01-1

      - name: Upload manual preview
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: reel-preview
          path: |
            output/*.mp4
            output/*.jpg
          retention-days: 3

      - name: Generate and publish the due Reel
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live-due')
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: python -m app.main

      - name: Persist successful publish state
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live-due')
        run: |
          if git diff --quiet -- state/posted.json; then
            echo "No state change; nothing was due or publish did not complete."
            exit 0
          fi
          git config user.name "ig-charity-bot"
          git config user.email "ig-charity-bot@users.noreply.github.com"
          git add state/posted.json
          git commit -m "state: record published reel"
          git pull --rebase origin main
          git push origin HEAD:main
