name: Publish Instagram reels

on:
  schedule:
    # GitHub's scheduler is driven with explicit UTC cron values here. The app
    # itself still evaluates due slots in Asia/Kolkata. This avoids depending
    # on timezone-aware cron behavior for the actual wake-up times.
    #
    # Morning target: 11:37 IST = 06:07 UTC, with catch-ups until 12:37 IST.
    - cron: '7 6 * * *'
    - cron: '22 6 * * *'
    - cron: '37 6 * * *'
    - cron: '52 6 * * *'
    - cron: '7 7 * * *'

    # Evening target: 20:07 IST = 14:37 UTC, with catch-ups until 21:07 IST.
    - cron: '37 14 * * *'
    - cron: '52 14 * * *'
    - cron: '7 15 * * *'
    - cron: '22 15 * * *'
    - cron: '37 15 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Manual action'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - live-due

permissions:
  contents: write

concurrency:
  group: ig-charity-publisher
  cancel-in-progress: false

jobs:
  publish-due-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg and fallback fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install app
        run: python -m pip install -e .

      - name: Cache downloaded music and fonts
        uses: actions/cache@v4
        with:
          path: |
            .cache/music
            .cache/fonts
          key: charity-assets-${{ hashFiles('config/music.yml', 'app/fonts.py') }}

      - name: Render safe manual preview
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        run: python -m app.main --render-only --force-slot 2099-01-01-1

      - name: Upload manual preview
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: reel-preview
          path: |
            output/*.mp4
            output/*.jpg
          retention-days: 3

      - name: Generate and publish the due Reel
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live-due')
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: python -m app.main

      - name: Persist successful publish state
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live-due')
        run: |
          if git diff --quiet -- state/posted.json; then
            echo "No state change; nothing was due or publish did not complete."
            exit 0
          fi
          git config user.name "ig-charity-bot"
          git config user.email "ig-charity-bot@users.noreply.github.com"
          git add state/posted.json
          git commit -m "state: record published reel"
          git pull --rebase origin main
          git push origin HEAD:main
