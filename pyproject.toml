[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ig-charity-automation"
version = "0.1.0"
description = "Fully automated Instagram charity reel generator and publisher"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.4",
  "PyYAML>=6.0.2",
  "requests>=2.32.3",
  "cloudinary>=1.41.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
